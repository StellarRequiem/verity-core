[project]
name = "verity-core"
version = "0.1.0"
description = "The verification primitive — as a library and an MCP tool: a Reality Anchor that refuses to believe unverified result-claims, plus a tamper-evident audit chain. Make any AI agent check itself."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "StellarRequiem" }]
keywords = ["verification", "audit", "provenance", "mcp", "reality-anchor", "trustworthy", "ai", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
verity-mcp = "verity.mcp:main"
verity = "verity.cli:main"
verity-serve = "verity.server:run"

[project.urls]
Homepage = "https://github.com/StellarRequiem/verity-core"
Repository = "https://github.com/StellarRequiem/verity-core"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
